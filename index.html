<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ Neon Particle Heart ✦</title>
    <style>
        /* ─── RESET & FULLSCREEN ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a12;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            cursor: default;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* ─── GLOW OVERLAY ─── */
        #glow-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(ellipse at 50% 50%,
                    rgba(255, 20, 80, 0.06) 0%,
                    rgba(255, 20, 80, 0.02) 40%,
                    transparent 70%);
            mix-blend-mode: screen;
        }

        /* ─── HUD / INFO ─── */
        #hud {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 28px;
            z-index: 10;
            pointer-events: none;
            flex-wrap: wrap;
            padding: 0 20px;
        }
        #hud span {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: auto;
            transition: all 0.3s ease;
        }
        #hud span:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.08);
        }
        #hud .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        #hud .dot.pink {
            background: #ff2d78;
            box-shadow: 0 0 12px #ff2d7888;
        }
        #hud .dot.cyan {
            background: #00d4ff;
            box-shadow: 0 0 12px #00d4ff88;
            animation-delay: 0.6s;
        }
        #hud .dot.purple {
            background: #a855f7;
            box-shadow: 0 0 12px #a855f788;
            animation-delay: 1.2s;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ─── TITLE (top-left) ─── */
        #title {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 10;
            pointer-events: none;
        }
        #title h1 {
            color: rgba(255, 255, 255, 0.12);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            display: inline-block;
        }
        #title h1 em {
            font-style: normal;
            color: rgba(255, 45, 120, 0.4);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            #hud span {
                font-size: 9px;
                padding: 4px 12px;
                gap: 12px;
            }
            #title h1 {
                font-size: 10px;
                padding: 4px 12px;
            }
            #title {
                top: 16px;
                left: 16px;
            }
            #hud {
                bottom: 16px;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── OVERLAY GLOW ─── -->
    <div id="glow-overlay"></div>

    <!-- ─── TITLE ─── -->
    <div id="title">
        <h1>✦ <em>neon</em> · heart</h1>
    </div>

    <!-- ─── HUD ─── -->
    <div id="hud">
        <span><span class="dot pink"></span> move mouse</span>
        <span><span class="dot cyan"></span> click to burst</span>
        <span><span class="dot purple"></span> scroll to zoom</span>
    </div>

    <!-- ─── THREE.JS ─── -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  IMPORTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SCENE SETUP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 28);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  POST-PROCESSING – BLOOM (neon glow)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.7, // strength
            0.3, // radius
            0.1 // threshold
        );
        composer.addPass(bloomPass);

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  HEART SHAPE – parametric
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function heartPosition(t, scale = 1) {
            // x = 16 sin³(t),  y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x * scale, y: y * scale };
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PARTICLE SYSTEM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const PARTICLE_COUNT = 4500;
        const HEART_SCALE = 0.42;
        const SPREAD = 0.28; // thickness in Z

        // ─── geometry ───
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);
        const basePositions = new Float32Array(PARTICLE_COUNT * 3); // store for reset
        const velocities = new Float32Array(PARTICLE_COUNT * 3);
        const randoms = new Float32Array(PARTICLE_COUNT);

        // color palette
        const palette = [
            new THREE.Color(0xff2d78), // hot pink
            new THREE.Color(0xff6b9d),
            new THREE.Color(0x00d4ff), // cyan
            new THREE.Color(0x4facfe),
            new THREE.Color(0xa855f7), // purple
            new THREE.Color(0xd946ef),
            new THREE.Color(0xf472b6),
        ];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // sample t with slight randomness for organic feel
            const t = Math.random() * Math.PI * 2;
            const r = 0.92 + Math.random() * 0.16; // slight radial variation
            const pos = heartPosition(t, HEART_SCALE * r);

            // add thickness in Z
            const z = (Math.random() - 0.5) * SPREAD * 2.2;

            // add tiny XY jitter for softness
            const jitter = 0.06;
            const x = pos.x + (Math.random() - 0.5) * jitter;
            const y = pos.y + (Math.random() - 0.5) * jitter;

            const idx = i * 3;
            positions[idx] = x;
            positions[idx + 1] = y;
            positions[idx + 2] = z;

            basePositions[idx] = x;
            basePositions[idx + 1] = y;
            basePositions[idx + 2] = z;

            // color – pick from palette with random offset
            const col = palette[Math.floor(Math.random() * palette.length)].clone();
            // vary brightness
            const bright = 0.7 + Math.random() * 0.5;
            col.multiplyScalar(bright);
            // slight hue shift
            const hsl = {};
            col.getHSL(hsl);
            col.setHSL(hsl.h + (Math.random() - 0.5) * 0.04, 1, 0.55 + Math.random() * 0.35);

            colors[idx] = col.r;
            colors[idx + 1] = col.g;
            colors[idx + 2] = col.b;

            sizes[i] = 0.08 + Math.random() * 0.18;
            randoms[i] = Math.random() * Math.PI * 2;
            velocities[idx] = 0;
            velocities[idx + 1] = 0;
            velocities[idx + 2] = 0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // ─── texture (soft round glow) ───
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createParticleTexture();

        // ─── material ───
        const material = new THREE.PointsMaterial({
            size: 0.28,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.92,
            vertexColors: true,
            sizeAttenuation: true,
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BACKGROUND STARS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const starCount = 1200;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        for (let i = 0; i < starCount; i++) {
            const r = 30 + Math.random() * 70;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = r * Math.cos(phi);
            starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            starSizes[i] = 0.04 + Math.random() * 0.12;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({
            color: 0x445566,
            size: 0.12,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MOUSE / INTERACTION STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        let isBursting = false;
        let burstTime = 0;
        let burstPower = 0;
        let zoomLevel = 28;

        // ─── mouse move ───
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            mouse.targetX = x * 0.8;
            mouse.targetY = y * 0.6;
        });

        // ─── click → burst ───
        window.addEventListener('click', () => {
            isBursting = true;
            burstTime = 0;
            burstPower = 1.8 + Math.random() * 0.8;
        });

        // ─── scroll → zoom ───
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomLevel += e.deltaY * 0.015;
            zoomLevel = Math.max(12, Math.min(50, zoomLevel));
        }, { passive: false });

        // ─── touch support ───
        let touchId = null;
        window.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            if (t) {
                const x = (t.clientX / window.innerWidth) * 2 - 1;
                const y = -(t.clientY / window.innerHeight) * 2 + 1;
                mouse.targetX = x * 0.8;
                mouse.targetY = y * 0.6;
                isBursting = true;
                burstTime = 0;
                burstPower = 1.8 + Math.random() * 0.8;
            }
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t) {
                const x = (t.clientX / window.innerWidth) * 2 - 1;
                const y = -(t.clientY / window.innerHeight) * 2 + 1;
                mouse.targetX = x * 0.8;
                mouse.targetY = y * 0.6;
            }
        }, { passive: true });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESIZE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ANIMATION LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const clock = new THREE.Clock();

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            // ─── smooth mouse ───
            mouse.x += (mouse.targetX - mouse.x) * 0.06;
            mouse.y += (mouse.targetY - mouse.y) * 0.06;

            // ─── camera zoom ───
            camera.position.z += (zoomLevel - camera.position.z) * 0.04;
            camera.lookAt(0, 0, 0);

            // ─── rotate stars slowly ───
            stars.rotation.y += dt * 0.008;
            stars.rotation.x += dt * 0.004;

            // ─── update particles ───
            const pos = geometry.attributes.position.array;
            const sizeAttr = geometry.attributes.size;
            const sizesArr = sizeAttr.array;

            // burst decay
            if (isBursting) {
                burstTime += dt;
                if (burstTime > 1.2) {
                    isBursting = false;
                    burstPower = 0;
                }
            }

            const burstStrength = isBursting ?
                burstPower * (1 - burstTime / 1.2) * 0.8 :
                0;

            const mouseInfluence = 0.4 + 0.6 * (1 - Math.abs(mouse.x) * 0.3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;

                // base position (heart shape)
                const bx = basePositions[idx];
                const by = basePositions[idx + 1];
                const bz = basePositions[idx + 2];

                // current position
                let px = pos[idx];
                let py = pos[idx + 1];
                let pz = pos[idx + 2];

                // ── burst force ──
                if (burstStrength > 0.01) {
                    const angle = randoms[i] + elapsed * 0.5;
                    const dirX = Math.cos(angle + i * 0.01);
                    const dirY = Math.sin(angle * 0.7 + i * 0.013);
                    const dirZ = Math.sin(angle * 0.4 + i * 0.017);
                    const dist = Math.sqrt(px * px + py * py + pz * pz) + 0.5;
                    const force = burstStrength * 1.6 / (dist * 0.7 + 0.3);
                    velocities[idx] += dirX * force * dt * 12;
                    velocities[idx + 1] += dirY * force * dt * 12;
                    velocities[idx + 2] += dirZ * force * dt * 8;
                }

                // ── mouse attraction ──
                const mx = mouse.x * 3.2;
                const my = mouse.y * 2.4;
                const dx = mx - px;
                const dy = my - py;
                const distToMouse = Math.sqrt(dx * dx + dy * dy + pz * pz * 0.3) + 0.1;
                const attractStrength = 0.6 / (distToMouse * 0.5 + 0.5);
                velocities[idx] += dx * attractStrength * dt * 1.6 * mouseInfluence;
                velocities[idx + 1] += dy * attractStrength * dt * 1.6 * mouseInfluence;
                velocities[idx + 2] += -pz * 0.15 * dt * 2;

                // ── spring force back to heart ──
                const springX = (bx - px) * 2.8;
                const springY = (by - py) * 2.8;
                const springZ = (bz - pz) * 2.2;
                velocities[idx] += springX * dt * 0.9;
                velocities[idx + 1] += springY * dt * 0.9;
                velocities[idx + 2] += springZ * dt * 0.8;

                // ── damping ──
                velocities[idx] *= (1 - dt * 2.8);
                velocities[idx + 1] *= (1 - dt * 2.8);
                velocities[idx + 2] *= (1 - dt * 2.4);

                // ── apply velocity ──
                pos[idx] += velocities[idx] * dt * 1.2;
                pos[idx + 1] += velocities[idx + 1] * dt * 1.2;
                pos[idx + 2] += velocities[idx + 2] * dt * 1.2;

                // ── soft clamp to prevent explosion ──
                const distFromCenter = Math.sqrt(pos[idx] ** 2 + pos[idx + 1] ** 2 + pos[idx + 2] ** 2);
                if (distFromCenter > 14) {
                    const scale = 14 / distFromCenter;
                    pos[idx] *= scale;
                    pos[idx + 1] *= scale;
                    pos[idx + 2] *= scale;
                    velocities[idx] *= 0.5;
                    velocities[idx + 1] *= 0.5;
                    velocities[idx + 2] *= 0.5;
                }

                // ── pulse size ──
                const pulse = 0.85 + 0.15 * Math.sin(elapsed * 0.6 + randoms[i] + i * 0.005);
                const baseSize = 0.08 + (i % 7) * 0.025;
                sizesArr[i] = baseSize * pulse * (1 + 0.3 * (1 - Math.abs(mouse.x) * 0.5));
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.size.needsUpdate = true;

            // ─── bloom strength dynamic ───
            const bloomTarget = 0.55 + 0.25 * (1 - Math.abs(mouse.x) * 0.3) + 0.15 * burstStrength;
            bloomPass.strength += (bloomTarget - bloomPass.strength) * 0.02;

            // ─── render ───
            composer.render();

            requestAnimationFrame(animate);
        }

        animate();
