<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌹 3D Rose for You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0d0d1a;
            font-family: 'Segoe UI', sans-serif;
            cursor: default;
        }
        canvas {
            display: block;
        }
        #message {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
            color: rgba(255, 200, 220, 0.7);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 60px;
            border: 1px solid rgba(255, 200, 220, 0.1);
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 100, 150, 0.3);
        }
        #message span {
            display: inline-block;
            animation: pulseText 2.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
                color: #ff9eb5;
            }
        }
        #heart-icon {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10;
            font-size: 28px;
            animation: floatHeart 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ff2d78);
        }
        @keyframes floatHeart {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }
        @media (max-width: 600px) {
            #message {
                font-size: 14px;
                padding: 10px 18px;
                bottom: 24px;
                width: 90%;
            }
            #heart-icon {
                top: 16px;
                right: 16px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div id="heart-icon">❤️</div>
    <div id="message"><span>✨ for you, with love ✨</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // --- POST PROCESSING (Bloom for glow) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.6, 0.3, 0.1
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // --- LIGHTS ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        const light1 = new THREE.PointLight(0xff4d6d, 2, 10);
        light1.position.set(2, 3, 4);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x4d9eff, 1.5, 10);
        light2.position.set(-3, 1, 3);
        scene.add(light2);

        const backLight = new THREE.DirectionalLight(0xffaacc, 0.8);
        backLight.position.set(0, 1, -5);
        scene.add(backLight);

        // --- ROSE CONSTRUCTION ---

        // 1. Stem
        const stemGeo = new THREE.CylinderGeometry(0.08, 0.12, 2.2, 8);
        const stemMat = new THREE.MeshStandardMaterial({
            color: 0x2d5a27,
            roughness: 0.6,
            metalness: 0.2,
            emissive: 0x0a1f0a,
            emissiveIntensity: 0.2
        });
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.y = -0.6;
        stem.rotation.z = 0.08;
        scene.add(stem);

        // 2. Leaves
        function createLeaf(posX, posY, posZ, rotY, rotZ, scale = 0.6) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.3, 0.2, 0.5, 0.1, 0.6, 0);
            shape.bezierCurveTo(0.5, -0.1, 0.3, -0.2, 0, 0);
            const leafGeo = new THREE.ShapeGeometry(shape);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x3a7a33,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide,
                emissive: 0x1a3a1a,
                emissiveIntensity: 0.15
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(posX, posY, posZ);
            leaf.rotation.y = rotY;
            leaf.rotation.z = rotZ;
            leaf.scale.set(scale, scale, scale);
            return leaf;
        }

        scene.add(createLeaf(0.2, -0.2, 0.15, 0.6, -0.4, 0.7));
        scene.add(createLeaf(-0.15, -0.35, -0.1, -0.8, 0.5, 0.6));

        // 3. Rose Petals (layered)
        function createPetal(radius, angle, tilt, color, emissiveColor, yOffset = 0, scale = 1) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.bezierCurveTo(0.4, 0.3, 0.7, 0.1, 0.8, -0.1);
            shape.bezierCurveTo(0.7, -0.3, 0.4, -0.4, 0, -0.2);
            shape.bezierCurveTo(-0.4, -0.4, -0.7, -0.3, -0.8, -0.1);
            shape.bezierCurveTo(-0.7, 0.1, -0.4, 0.3, 0, 0);

            const petalGeo = new THREE.ShapeGeometry(shape);
            const petalMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.1,
                side: THREE.DoubleSide,
                emissive: emissiveColor,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.92
            });
            const petal = new THREE.Mesh(petalGeo, petalMat);
            petal.position.set(
                Math.cos(angle) * radius,
                yOffset + Math.sin(angle) * 0.05,
                Math.sin(angle) * radius
            );
            petal.rotation.y = -angle;
            petal.rotation.x = tilt;
            petal.rotation.z = 0.1;
            petal.scale.set(scale, scale, scale);
            return petal;
        }

        // Colors
        const colors = [
            0xff4d6d, 0xff6b8a, 0xff8da1, 0xffb3c6,
            0xff2d55, 0xff6384, 0xff9eb5, 0xffc2d1
        ];
        const emissiveColors = [
            0x661122, 0x882244, 0xaa3366, 0xcc4477,
            0x551133, 0x771144, 0x991155, 0xbb2266
        ];

        // Outer petals (larger)
        for (let layer = 0; layer < 3; layer++) {
            const count = 6 + layer * 2;
            const radius = 0.7 + layer * 0.15;
            const tilt = 0.3 + layer * 0.1;
            const yBase = -0.1 + layer * 0.08;
            const scale = 1 - layer * 0.05;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + layer * 0.3;
                const colorIdx = (i + layer * 3) % colors.length;
                const petal = createPetal(
                    radius,
                    angle,
                    tilt + Math.sin(angle * 2) * 0.1,
                    colors[colorIdx],
                    emissiveColors[colorIdx % emissiveColors.length],
                    yBase + Math.sin(angle * 3) * 0.04,
                    scale * (0.85 + Math.random() * 0.15)
                );
                scene.add(petal);
            }
        }

        // Inner petals (tighter)
        for (let layer = 0; layer < 3; layer++) {
            const count = 5 + layer * 2;
            const radius = 0.35 + layer * 0.12;
            const tilt = 0.5 + layer * 0.15;
            const yBase = 0.1 + layer * 0.06;
            const scale = 0.8 - layer * 0.04;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + layer * 0.5;
                const colorIdx = (i + layer * 4 + 2) % colors.length;
                const petal = createPetal(
                    radius,
                    angle,
                    tilt + Math.sin(angle * 2 + 0.5) * 0.08,
                    colors[colorIdx],
                    emissiveColors[colorIdx % emissiveColors.length],
                    yBase + Math.cos(angle * 2) * 0.03,
                    scale * (0.9 + Math.random() * 0.1)
                );
                scene.add(petal);
            }
        }

        // Center bud
        const budGeo = new THREE.SphereGeometry(0.18, 12, 12);
        const budMat = new THREE.MeshStandardMaterial({
            color: 0xff2d55,
            emissive: 0x882244,
            emissiveIntensity: 0.3,
            roughness: 0.2,
            metalness: 0.1
        });
        const bud = new THREE.Mesh(budGeo, budMat);
        bud.position.y = 0.25;
        scene.add(bud);

        // --- FLOATING HEART PARTICLES ---
        const heartParticlesGeo = new THREE.BufferGeometry();
        const heartCount = 400;
        const heartPos = new Float32Array(heartCount * 3);
        const heartSizes = new Float32Array(heartCount);
        const heartSpeeds = new Float32Array(heartCount);
        for (let i = 0; i < heartCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const r = 1.2 + Math.random() * 2.5;
            const y = -0.8 + Math.random() * 2.5;
            heartPos[i * 3] = Math.cos(theta) * r;
            heartPos[i * 3 + 1] = y;
            heartPos[i * 3 + 2] = Math.sin(theta) * r;
            heartSizes[i] = 0.04 + Math.random() * 0.1;
            heartSpeeds[i] = 0.2 + Math.random() * 0.4;
        }
        heartParticlesGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
        heartParticlesGeo.setAttribute('size', new THREE.BufferAttribute(heartSizes, 1));

        const heartTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(255,0,0,0)';
            ctx.fillRect(0, 0, 32, 32);
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ff4d6d';
            ctx.shadowColor = '#ff2d78';
            ctx.shadowBlur = 10;
            ctx.fillText('❤️', 16, 16);
            return new THREE.CanvasTexture(canvas);
        })();

        const heartMat = new THREE.PointsMaterial({
            size: 0.25,
            map: heartTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true,
        });
        const heartParticles = new THREE.Points(heartParticlesGeo, heartMat);
        scene.add(heartParticles);

        // --- MOUSE TRACKING (rose turns to face mouse) ---
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t) {
                mouse.targetX = (t.clientX / window.innerWidth) * 2 - 1;
                mouse.targetY = -(t.clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: true });

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            // Smooth mouse
            mouse.x += (mouse.targetX - mouse.x) * 0.04;
            mouse.y += (mouse.targetY - mouse.y) * 0.04;

            // Rotate rose slightly based on mouse
            const targetRotY = mouse.x * 0.6;
            const targetRotX = mouse.y * 0.3;
            // Apply to the whole rose group (we'll group all parts)
            // Instead of grouping, we rotate each part? Better: create a group.
            // But we already added directly to scene. So we'll rotate a parent group.
            // Let's create a group and move all parts to it.
            // Quick fix: we'll just rotate the camera around? No, better to rotate the rose.
            // I'll refactor: move all rose parts into a group.
            // Since we already added, we'll do it now.
            // Actually, let's just rotate all children that are rose parts.
            // For simplicity, we'll rotate the whole scene? No.
            // We'll create a group and move objects.
            // But it's too late. I'll just rotate the stem and petals manually? 
            // Better: I'll create a group at start, but I didn't.
            // Let's do a quick workaround: rotate all mesh children of scene that are not particles or lights.
            // But it's messy.
            // Simplest: I'll re-write with a group.
            // But since I already wrote above, I'll just add a group now and move objects to it.
            // I'll do it in the next code version. For now, I'll let the rose rotate as a whole by rotating the scene's children.
            // Let's just rotate the camera around the rose? That's easier.
            // camera.position.x = 6 * Math.sin(mouse.x * 0.5);
            // camera.position.z = 6 * Math.cos(mouse.x * 0.5);
            // camera.lookAt(0, 0, 0);
            // This is a nice effect! Let's do that.

            const camRadius = 6;
            const angle = mouse.x * 1.2;
            const heightOffset = mouse.y * 0.8;
            camera.position.x = Math.sin(angle) * camRadius;
            camera.position.z = Math.cos(angle) * camRadius;
            camera.position.y = 1.5 + heightOffset * 0.5;
            camera.lookAt(0, 0.2, 0);

            // Animate heart particles
            const positions = heartParticles.geometry.attributes.position.array;
            for (let i = 0; i < heartCount; i++) {
                const idx = i * 3;
                // rotate around Y
                const x = positions[idx];
                const z = positions[idx + 2];
                const speed = heartSpeeds[i];
                const newX = x * Math.cos(dt * speed * 0.3) - z * Math.sin(dt * speed * 0.3);
                const newZ = x * Math.sin(dt * speed * 0.3) + z * Math.cos(dt * speed * 0.3);
                positions[idx] = newX;
                positions[idx + 2] = newZ;
                // bob up and down
                positions[idx + 1] += Math.sin(elapsed * 0.5 + i) * dt * 0.02;
            }
            heartParticles.geometry.attributes.position.needsUpdate = true;

            // Pulse bloom
            bloomPass.strength = 0.5 + 0.15 * Math.sin(elapsed * 0.3);

            // Rotate the whole rose group (we need to group, but we can't now. I'll rotate each petal? 
            // Let's just rotate the stem and petals by rotating their parent? No.
            // I'll just apply rotation to each mesh individually? 
            // For now, I'll skip the rose rotation and just let camera do the work.
            // So the rose stays fixed, camera moves around it. That's actually beautiful.

            composer.render();
            requestAnimationFrame(animate);
        }

        animate();

        // --- CONSOLE ---
        console.log('🌹 A rose for you! ❤️');
    </script>
</body>
</html>
